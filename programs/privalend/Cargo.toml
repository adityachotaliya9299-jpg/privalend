[package]
name = "privalend"
version = "0.1.0"
description = "Private cross-chain lending using Encrypt FHE + Ika dWallets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "privalend"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
anchor-spl = "0.32"

# Encrypt FHE — real pre-alpha from dwallet-labs
encrypt-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-dsl = { package = "encrypt-solana-dsl", git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-anchor = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }

# Ika dWallet — real pre-alpha from dwallet-labs
ika-dwallet-anchor = { git = "https://github.com/dwallet-labs/ika-pre-alpha" }
